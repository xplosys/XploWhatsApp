name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests (PostgreSQL + Redis via Testcontainers)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t xplowhatsapp-api ./backend
          docker build -t xplowhatsapp-frontend ./frontend

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads every commit
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --disable-pip --no-deps
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - name: Secrets in history (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path /tmp/leaks.json \
            || { jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) commit \(.Commit[0:8])"' /tmp/leaks.json; exit 1; }

  image-scan:
    runs-on: ubuntu-24.04
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t xplowhatsapp-api ./backend
          docker build -t xplowhatsapp-frontend ./frontend
      - name: Scan images (Trivy, fixable high and critical)
        run: |
          for image in xplowhatsapp-api xplowhatsapp-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
