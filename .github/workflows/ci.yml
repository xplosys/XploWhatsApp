name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests (PostgreSQL + Redis via Testcontainers)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t xplowhatsapp-api ./backend
          docker build -t xplowhatsapp-frontend ./frontend

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Test environment
        run: e2e/scripts/test-env.sh
      - name: Start the stack (fake Meta and AI services)
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build
      - name: Browser
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: e2e
        run: pnpm test
      - name: Page snapshots of failed tests
        if: failure()
        working-directory: e2e
        run: find test-results -name error-context.md -exec sh -c 'echo "::group::$1"; cat "$1"; echo "::endgroup::"' _ {} \;
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml logs --no-color --tail 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads every commit
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --disable-pip --no-deps
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - name: Secrets in history (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path /tmp/leaks.json \
            || { jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) commit \(.Commit[0:8])"' /tmp/leaks.json; exit 1; }

  image-scan:
    runs-on: ubuntu-24.04
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t xplowhatsapp-api ./backend
          docker build -t xplowhatsapp-frontend ./frontend
      - name: Scan images (Trivy, fixable high and critical)
        run: |
          status=0
          for image in xplowhatsapp-api xplowhatsapp-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image" || status=1
          done
          exit $status

  deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m" -w /m/tests --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules xplowhatsapp.test.yml
          echo token > /tmp/metrics_token
          docker run --rm -v "$PWD/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/monitoring/rules:/etc/prometheus/rules:ro" -v /tmp/metrics_token:/etc/prometheus/metrics_token:ro \
            --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Compose file
        run: |
          cp .env.example .env
          IMAGE_TAG=ci APP_DOMAIN=app.example.com GRAFANA_ADMIN_PASSWORD=x \
            docker compose -f docker-compose.prod.yml --profile monitoring --profile ops --profile storage config --quiet
      - name: Nginx configuration
        run: deploy/scripts/test-nginx.sh
      - name: Shell scripts
        run: shellcheck deploy/scripts/*.sh deploy/backup/*.sh deploy/nginx/*.sh e2e/scripts/*.sh
