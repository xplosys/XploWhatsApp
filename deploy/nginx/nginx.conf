# Nginx for XploWhatsApp. Sites are rendered from templates/ into /etc/nginx/xplo by the
# image's envsubst step, then 40-xplo-sites.sh enables the HTTPS sites once certificates exist.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # JSON access log without query strings (they can carry tokens) or cookies.
    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time","request_id":"$request_id"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Per-IP request budgets. The API also limits per person and per sign-in; this stops
    # floods before they reach Python.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Docker's DNS, so upstream containers can restart without reloading Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
